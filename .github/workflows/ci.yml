name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Version policy
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            python3 scripts/check_version.py --base "$BASE"
          else
            python3 scripts/check_version.py
          fi
      - run: python3 scripts/test_version.py
      - run: python3 scripts/test_evidence.py
      - name: Discovery recording tests
        run: python3 -m unittest discover -s demo -p 'test_*.py'
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate release tag before approval
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check_version.py --tag "$RELEASE_TAG"
      - run: cargo fetch --locked
      - run: python3 scripts/validate_local.py artifacts/ci
      - run: python3 scripts/verify_evidence.py artifacts/ci --report artifacts/evidence.json
      - name: Discovery recording integration
        run: python3 demo/smoke.py artifacts/discovery-demo --binary target/release/braess-router
      - run: cargo package --locked
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ci
            artifacts/evidence.json
            artifacts/discovery-demo
          retention-days: 14
          include-hidden-files: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/braess-evidence
      - name: Verify downloaded evidence
        run: python3 scripts/verify_evidence.py "$RUNNER_TEMP/braess-evidence/ci" --report "$RUNNER_TEMP/braess-evidence-report.json"
