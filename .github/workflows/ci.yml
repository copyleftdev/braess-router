name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Version policy
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            python3 scripts/check_version.py --base "$BASE"
          else
            python3 scripts/check_version.py
          fi
      - run: python3 scripts/test_version.py
      - run: python3 scripts/test_evidence.py
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate release tag before approval
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check_version.py --tag "$RELEASE_TAG"
      - run: cargo fetch --locked
      - run: python3 scripts/validate_local.py artifacts/ci
      - run: python3 scripts/verify_evidence.py artifacts/ci --report artifacts/evidence.json
      - run: cargo package --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ci
            artifacts/evidence.json
          retention-days: 14
