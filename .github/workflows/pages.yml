name: GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/check_site.py', 'scripts/test_site.py', 'scripts/build_discovery_site.py', 'demo/web/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'scripts/check_site.py', 'scripts/test_site.py', 'scripts/build_discovery_site.py', 'demo/web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate and stage public assets
        run: |
          python3 scripts/test_site.py
          python3 scripts/build_discovery_site.py --check
          node --check site/discovery/app.js
          node --check site/app.js
          node --check site/traffic-data.js
          python3 scripts/check_site.py --stage "$RUNNER_TEMP/braess-site"
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/braess-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
